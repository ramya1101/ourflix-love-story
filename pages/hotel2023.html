<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OURFLIX Memories</title>

<link rel="stylesheet" href="../style.css">

</head>

<body class="gallery-page">

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo"
    onclick="window.location.href='timeline.html'">

        OURFLIX

    </div>
<ul>

        <li onclick="window.location.href='timeline.html'">
    Home
</li>

    <li onclick="window.location.href='home2023.html'">        
    Go back to 2023
</li>

    </ul>

</nav>

<!-- TITLE -->

<h1 class="gallery-title">
    Our Hotel Dates
</h1>

<div class="galery-grid">
    
    <img src="../assets/photos/h1.jpg">
    <img src="../assets/photos/h2.jpg">
    <img src="../assets/photos/h3.jpg">
    <img src="../assets/photos/h4.jpg">
    <img src="../assets/photos/h5.jpg">
    <img src="../assets/photos/h6.jpg">
    <img src="../assets/photos/h7.jpg">
    <img src="../assets/photos/h8.jpg">
    <img src="../assets/photos/h9.jpg">
    <img src="../assets/photos/h10.jpg">
    <img src="../assets/photos/h11.jpg">
    <img src="../assets/photos/h12.jpg">
    <img src="../assets/photos/h13.jpg">
    <img src="../assets/photos/h14.jpg">
    <img src="../assets/photos/h15.jpg">
    <img src="../assets/photos/h16.jpg">
    <img src="../assets/photos/h17.jpg">
    <img src="../assets/photos/h18.jpeg">
    <img src="../assets/photos/h19.jpeg">


</div>


<!-- FULLSCREEN IMAGE MODAL -->

<div class="image-modal" id="imageModal">

    <span class="close-modal" id="closeModal">
        ✕
    </span>

    <img id="modalImage">

</div>
<script>

/* GET ELEMENTS */

const modal =
document.getElementById("imageModal");

const modalImg =
document.getElementById("modalImage");

const closeModal =
document.getElementById("closeModal");

/* SELECT ALL GALLERY IMAGES */

const images =
document.querySelectorAll(".galery-grid img");

/* OPEN MODAL */

images.forEach((img)=>{

    img.addEventListener("click", ()=>{

        modal.classList.add("active");

        modalImg.src = img.src;
    });

});

/* CLOSE BUTTON */

closeModal.addEventListener("click", ()=>{

    modal.classList.remove("active");
});

/* CLICK OUTSIDE */

modal.addEventListener("click", (e)=>{

    if(e.target === modal){

        modal.classList.remove("active");
    }
});

/* ESC KEY */

document.addEventListener("keydown", (e)=>{

    if(e.key === "Escape"){

        modal.classList.remove("active");
    }
});

</script>

</body>
</html>
