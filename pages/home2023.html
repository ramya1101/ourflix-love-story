<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OURFLIX - 2023</title>

  <link rel="stylesheet" href="../style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        OURFLIX
    </div>

    <ul>

        <li onclick="window.location.href='timeline.html'">
    Home
</li>
        <li onclick="window.location.href='memories2023.html'">
    Memories
</li>
        <li onclick="window.location.href='trips2023.html'">
    Trips
</li>
     <li onclick="window.location.href='beach2023.html'">
    Beach & Exhibition
</li>

     <li onclick="window.location.href='hotel2023.html'">
    Hotel Dates
</li>


     <li onclick="window.location.href='bday2023.html'">
    Your birthday
</li>

    </ul>

</nav>

<!-- HERO SECTION -->

<section class="hero">

    <img src="../assets/photos/2023.jpg" class="hero-bg">

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <h1>
            The Golden Year
        </h1>

        <p>
            The year where memories became forever.
        </p>

        <div class="hero-buttons">

            <button class="play-btn">
                ▶ Play
            </button>

            <button class="info-btn">
                ℹ More Info
            </button>

        </div>

    </div>

</section>

<!-- MOVIE ROW -->

<h1 class="gallery-title">
    Top Memories Together
</h1>

<div class="galery-grid">
         <img src="../assets/photos/memory1.jpg">
        <img src="../assets/photos/memory2.jpg">
        <img src="../assets/photos/memory3.jpg">
        <img src="../assets/photos/memory4.jpg">
        <img src="../assets/photos/memory5.jpg">
        <img src="../assets/photos/memory6.jpg">
        <img src="../assets/photos/memory7.jpg">
        <img src="../assets/photos/memory8.jpg">
        <img src="../assets/photos/memory9.jpg">
        <img src="../assets/photos/memory10.jpg">
</div>
    

<!-- VIDEO PLAYER -->

<div id="video-player">

    <video id="memory-video" controls>

        <source src="../assets/videos/golden-year.mp4" type="video/mp4">

    </video>

    <button id="close-video">
        ✕
    </button>

</div>

<script>

const playBtn = document.querySelector(".play-btn");

const infoBtn = document.querySelector(".info-btn");

const videoPlayer = document.getElementById("video-player");

const memoryVideo = document.getElementById("memory-video");

const closeVideo = document.getElementById("close-video");

/* PLAY BUTTON */

playBtn.addEventListener("click", () => {

    videoPlayer.style.display = "flex";

    memoryVideo.play();
});

/* CLOSE BUTTON */

closeVideo.addEventListener("click", () => {

    videoPlayer.style.display = "none";

    memoryVideo.pause();
});

/* MORE INFO BUTTON */

infoBtn.addEventListener("click", () => {

    alert(
        "2023 — The Golden Year 💖\n\nThis was the year where memories became forever."
    );
});

</script>

<!-- FULLSCREEN IMAGE MODAL -->

<div class="image-modal" id="imageModal">

    <span class="close-modal" id="closeModal">
        ✕
    </span>

    <img id="modalImage">

</div>
<script>

/* GET ELEMENTS */

const modal =
document.getElementById("imageModal");

const modalImg =
document.getElementById("modalImage");

const closeModal =
document.getElementById("closeModal");

/* SELECT ALL GALLERY IMAGES */

const images =
document.querySelectorAll(".galery-grid img");

/* OPEN MODAL */

images.forEach((img)=>{

    img.addEventListener("click", ()=>{

        modal.classList.add("active");

        modalImg.src = img.src;
    });

});

/* CLOSE BUTTON */

closeModal.addEventListener("click", ()=>{

    modal.classList.remove("active");
});

/* CLICK OUTSIDE */

modal.addEventListener("click", (e)=>{

    if(e.target === modal){

        modal.classList.remove("active");
    }
});

/* ESC KEY */

document.addEventListener("keydown", (e)=>{

    if(e.key === "Escape"){

        modal.classList.remove("active");
    }
});

</script>

</body>

</html>
