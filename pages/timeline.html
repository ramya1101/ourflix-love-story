<body>

<div class="timeline-page">

    <div class="overlay"></div>

    <h1 class="timeline-title">
        Choose Your Chapter

    <div class="timeline-grid">

            </div>

        </div>

        <div class="timeline-card" onclick="window.location.href='home2022.html'">

            <img src="../assets/photos/2022.jpeg">

            <div class="card-overlay">
                <h2>2022</h2>
                <p>Lets talk more?</p>
            </div>

        </div>

        <div class="timeline-card" onclick="window.location.href='home2023.html'">

            <img src="../assets/photos/2023.jpg">

            <div class="card-overlay">
                <h2>2023</h2>
                <p>Closer Than Ever</p>
            </div>

        </div>

        <div class="timeline-card" onclick="window.location.href='home2024.html'">

            <img src="../assets/photos/2024.jpeg">

            <div class="card-overlay">
                <h2>2024</h2>
                <p>Distance & Destiny</p>
            </div>

        </div>

        <div class="timeline-card" onclick="window.location.href='home2025.html'">

                <p>Still Loading...</p>
            </div>

        </div>

    </div>

</div>


<!-- FULLSCREEN IMAGE MODAL -->

<div class="image-modal" id="imageModal">

    <span class="close-modal" id="closeModal">
        ✕
    </span>

    <img id="modalImage">

</div>
<script>

/* GET ELEMENTS */

const modal =
document.getElementById("imageModal");

const modalImg =
document.getElementById("modalImage");

const closeModal =
document.getElementById("closeModal");

/* SELECT ALL GALLERY IMAGES */

const images =
document.querySelectorAll(".galery-grid img");

/* OPEN MODAL */

images.forEach((img)=>{

    img.addEventListener("click", ()=>{

        modal.classList.add("active");

        modalImg.src = img.src;
    });

});

/* CLOSE BUTTON */

closeModal.addEventListener("click", ()=>{

    modal.classList.remove("active");
});

/* CLICK OUTSIDE */

modal.addEventListener("click", (e)=>{

    if(e.target === modal){

        modal.classList.remove("active");
    }
});

/* ESC KEY */

document.addEventListener("keydown", (e)=>{

    if(e.key === "Escape"){

        modal.classList.remove("active");
    }
});

</script>

</body>

</html>
